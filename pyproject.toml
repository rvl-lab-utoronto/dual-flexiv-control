[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dual-flexiv-control"
version = "0.1.0"
description = "Bimanual Flexiv control brain: shared-memory data streams, real flexivrdk proprioception, and a FACTR teleop interface."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "James Ross" }]
dependencies = [
    "numpy>=2.0",
    "flexivrdk==1.8.0",
    "dynamixel-sdk>=3.7",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "websockets>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
# Experiment dashboard (Streamlit control panel + embedded Rerun web viewer).
# Rerun pins to the 0.33 line because serve_grpc/serve_web_viewer are version-
# matched to the bundled web viewer and the serve API still moves between minors.
dashboard = [
    "rerun-sdk>=0.33,<0.34",
    "streamlit>=1.40",
]
# Teleoperated data collection -> LeRobot dataset export. lerobot provides the
# dataset writer (async image writer + streaming video encoding) the collection
# loop records into; install only on the collection host.
collection = [
    "lerobot>=0.1",
]
# Online policy eval: msgpack-numpy codec for the openpi WebSocket protocol.
# websockets itself is a core dependency because FACTR uses it too.
policy = [
    "msgpack>=1.0",
]
# ACME policy eval: HTTP multipart client (torch.save'd image tensors + npz
# lowdim). `torch` is only used to serialize uint8 tensors on the robot host.
acme = [
    "requests>=2.28",
    "torch>=2.0",
]

[project.scripts]
dual-flexiv-control = "dual_flexiv_control.system:main"
dfc-cleanup-shm = "dual_flexiv_control.streams.registry:cleanup_cli"
dfc-dashboard = "dual_flexiv_control.dashboard.launch:main"
dfc-session = "dual_flexiv_control.session:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dual_flexiv_control"]
# Ship the Hydra YAML config tree as package data.
artifacts = ["src/dual_flexiv_control/conf/**/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: end-to-end runs that spawn the whole system (deselect with '-m \"not slow\"')",
]
