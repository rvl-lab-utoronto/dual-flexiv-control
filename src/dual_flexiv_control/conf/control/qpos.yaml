defaults:
  - base_control
  - _self_

# Joint position control (latest-wins setpoints posted by the brain). On hardware,
# arm.rt_streaming hands qpos to the native RDK 1.8 controller, which switches to
# RT_JOINT_POSITION and calls StreamJointPosition(q_d, dq_d, ddq_d) every 1 ms.
# Simulation and an explicitly disabled rt_streaming retain the Python NRT path.
kind: qpos
mode: NRT_JOINT_POSITION
send_fn: SendJointPosition
command:                # SendJointPosition args -> dim (== arm DoF)
  q_d: 7               # target joint positions    [rad]
  dq_d: 7              # target joint velocities    [rad/s] (feedforward)
  dq_max: 7            # max joint velocity         [rad/s]   (static, from coeffs)
  ddq_max: 7           # max joint acceleration     [rad/s^2] (static, from coeffs)
streamed: [q_d, dq_d]  # posted per tick on the setpoint channel (dim 14)
