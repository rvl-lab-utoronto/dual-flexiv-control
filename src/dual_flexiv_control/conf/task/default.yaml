defaults:
  - base_task
  - /control@control: qpos
  - _self_

# A manipulation task: the natural-language goal (shared by collection + eval),
# its dataset, and the per-phase counts. Copy this file to add a task, then select
# it with `task=<name>`.
#
# The defaults list selects this task's controller. ``qpos`` uses Flexiv's normal
# SDK joint-position behavior; choose ``qpos_overdamped`` for heavier damping.
language_instruction: "Perform the bimanual task."
collection:
  repo_id: dfc/bimanual  # LeRobot dataset for this task (under the recording root)
  num_episodes: 50      # demonstrations to teleoperate and record
eval:
  num_timesteps: 400    # rollout horizon (max steps before an eval episode is cut off)
