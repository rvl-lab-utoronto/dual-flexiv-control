# Main composed configuration for the bimanual Flexiv brain.
#
# Three orthogonal axes select a run:
#   rig=<name>            what hardware exists (arms/cameras/FACTR + serials) — conf/rig
#   task=<name>           what is being demonstrated/evaluated — conf/task
#   runtime.phase=<p>     collection | eval
#
# Override anything from the CLI, Hydra-style, e.g.:
#   dual-flexiv-control runtime.sim=true runtime.duration_s=10
#   dual-flexiv-control rig=bench runtime.phase=collection
#   dual-flexiv-control control@policy.control=force brain.rate_hz=200
#   dual-flexiv-control task=handover task.eval.num_timesteps=800
defaults:
  - base_config            # structured schema (ConfigStore) -> validates everything below
  - runtime: default
  - brain: default
  - recording: default     # dataset-export machinery (root/encoders/writers)
  - task: default          # active manipulation task (switch with `task=<name>`)
  - control_coeffs@task.eval.coeffs: compliant  # match eval dynamics to teleop collection
  - policy: openpi         # eval policy-server client (used when runtime.phase=eval)
  - rig: left_only         # the hardware: arms/cameras/FACTR + serials (`rig=<name>`).
                           # Defaults to the single-arm rig that matches the plugged-in
                           # hardware (left Rizon + left FACTR leader on :5000), so a
                           # collection run's launch-time preflight (every configured
                           # leader must respond) is satisfiable. Use `rig=bimanual` once
                           # the right leader (:5001) is served.
  - _self_                 # this file's values win over the groups above

hydra:
  job:
    chdir: false          # stay in the launch cwd so runtime_dir resolves predictably
  run:
    dir: outputs/${now:%Y-%m-%d_%H-%M-%S}
