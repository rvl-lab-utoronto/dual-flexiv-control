defaults:
  - base_policy
  - /control@control: qpos_impedance

# Stock OpenPI ALOHA endpoint for pi0.5-base. The Python adapter knows only
# OpenPI request/response conventions. Every embodiment-specific index copy is
# explicit here.
kind: remote
adapter: openpi
transport: websocket
host: 192.168.2.101
port: 8000
max_consecutive_errors: 3

openpi:
  request:
    state:
      key: state
      dim: 14
      slices:
        - name: left Flexiv joints except L2
          source: [0, 1, 3, 4, 5, 6]
          target: [0, 1, 2, 3, 4, 5]
        - name: right Flexiv joints except R2
          source: [7, 8, 10, 11, 12, 13]
          target: [7, 8, 9, 10, 11, 12]
      constants:
        - name: open ALOHA grippers
          target: [6, 13]
          value: 0.0
    images_key: images
    images:
      - source: static_left
        key: cam_high
        layout: chw
    prompt_key: prompt
  response:
    actions:
      key: actions
      dim: 16
      slices:
        - name: left ALOHA joints to DFC
          source: [0, 1, 2, 3, 4, 5]
          target: [0, 1, 3, 4, 5, 6]
        - name: left gripper
          source: [6]
          target: [7]
        - name: right ALOHA joints to DFC
          source: [7, 8, 9, 10, 11, 12]
          target: [8, 9, 11, 12, 13, 14]
        - name: right gripper
          source: [13]
          target: [15]
      state_holds:
        - name: hold measured L2
          source: [2]
          target: [2]
        - name: hold measured R2
          source: [9]
          target: [10]
