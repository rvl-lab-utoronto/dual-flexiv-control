defaults:
- base_factr
- _self_
servers:
  left:
    host: localhost
    port: 5000
    endpoint: ws/left
    request_timeout_s: 0.5
    dof: 8
  right:
    host: localhost
    port: 5001
    endpoint: ws/right
    request_timeout_s: 0.5
    dof: 8
leaders:
  # DFC is the source of truth for every arm direction. FACTR composes each
  # raw_to_dfc sign with dfc_to_factr for model state and motor torque.
  left:
    raw_to_dfc:
      offsets_deg:
      - 0
      - -171.69
      - 90
      - 133.51
      - 0
      - 0
      - 0
      sign_flip_joints:
      - 5
      drop_trailing: 1
      gripper_open: 1.0953
      gripper_closed: 1.4926
    home_q_rad:
    - 0
    - 0
    - 0
    - 1.57
    - 0
    - 0
    - 1.57079632679
    dfc_to_factr:
      signs:
      - 1
      - 1
      - 1
      - 1
      - 1
      - 1
      - 1
  right:
    raw_to_dfc:
      offsets_deg:
      - -90
      - -40
      - 90
      - -160
      - 0
      - 180
      - 0
      sign_flip_joints: []
      drop_trailing: 1
      gripper_open: 2.4
      gripper_closed: 3.0
    home_q_rad:
    - 0
    - 0
    - 0
    - 1.57079632679
    - 0
    - 0
    - -1.57079632679
    dfc_to_factr:
      signs:
      - 1
      - 1
      - 1
      - 1
      - 1
      - 1
      - 1
launch:
  enabled: true
  workdir: ~/FACTR-Server/FACTR_Teleop
  teleop_modules:
    left: src.factr_teleop.factr_teleop.factr_rizon_teleop
    right: src.factr_teleop.factr_teleop.factr_rizon_dual_board
