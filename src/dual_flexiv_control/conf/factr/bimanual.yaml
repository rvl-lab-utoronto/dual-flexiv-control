defaults:
  - base_factr
  - _self_

# The FACTR-Server's factr_api runs as ONE FastAPI process on :5001 serving a
# per-side endpoint for each leader arm:
#   /get_joint_positions_left   <- ROS /joint_pos_left
#   /get_joint_positions_right  <- ROS /joint_pos_right
# The FactrInterface producer node polls each configured endpoint and publishes
# it as the factr/<side> shared-memory stream — the single source of leader data
# for control and the dashboard alike. Each endpoint returns DoF+1 values
# (7 arm joints + a trailing gripper) under the `joint_pos` key, so dof is 8;
# the per-arm JointConventionCfg drops the trailing gripper before setpoints.
#
# An endpoint whose ROS publisher isn't running serves a zeros placeholder /
# goes unreachable; its stream then reads stale and the side shows disconnected.
servers:
  left:  { host: localhost, port: 5001, endpoint: get_joint_positions_left,  request_timeout_s: 0.5, dof: 8 }
  right: { host: localhost, port: 5001, endpoint: get_joint_positions_right, request_timeout_s: 0.5, dof: 8 }

# The session daemon launches/supervises the FACTR-Server processes themselves
# (the grav-comp teleops + the API relay) from the dashboard's Teleop leaders
# panel — replacing the FACTR-Server repo's "Launch EVERYTHING" VS Code task.
# Launching stays user-initiated: the teleops energize the leader servos and
# read a calibration pose at boot. Ignored under runtime.sim.
launch:
  enabled: true
  workdir: ~/FACTR-Server/FACTR_Teleop
  teleop_modules:
    left: src.factr_teleop.factr_teleop.factr_rizon_teleop        # single-board
    right: src.factr_teleop.factr_teleop.factr_rizon_dual_board   # both power boards
