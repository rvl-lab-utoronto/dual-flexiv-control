defaults:
  - base_factr
  - _self_

# Left leader only — the FACTR relay's WebSocket on :5000 (see
# factr/bimanual.yaml for the full layout). Use when only the left leader is
# plugged in, so no client is created for the absent right stream. Matches the
# left entry of factr/bimanual.yaml. The FactrInterface node consumes this stream and
# publishes the factr/left stream that control AND the dashboard read.
servers:
  left: { host: localhost, port: 5000, endpoint: ws/left, request_timeout_s: 0.5, dof: 8 }

# Daemon-managed FACTR-Server launch (left leader only; see factr/bimanual.yaml).
launch:
  enabled: true
  workdir: ~/FACTR-Server/FACTR_Teleop
  teleop_modules:
    left: src.factr_teleop.factr_teleop.factr_rizon_teleop        # single-board
