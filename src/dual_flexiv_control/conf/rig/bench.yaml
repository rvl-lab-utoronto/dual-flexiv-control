# @package _global_
# Bench test rig: a DUMMY (fabricated) left arm + the one real static ZED.
#
# For bring-up / pipeline testing when the robots aren't connected: the left arm
# publishes fabricated proprio (no flexivrdk connection — arm/flexiv_dummy), the
# static camera opens the real connected ZED (auto_serial), and actions are recorded
# from the real left FACTR leader (:5000). No right arm, no wrist cameras.
# Recordings are quarantined under datasets/bench (they show in Storage as bench/…).
#
#   dual-flexiv-control rig=bench runtime.phase=collection
defaults:
  - /arm@arms.left: flexiv_dummy        # fabricated proprio — no robot connection
  - /camera@cameras.static: zed2_static # the real connected ZED 2i
  - /factr: left                        # left leader only (:5001)
  - _self_

arms:
  left:
    control: ${policy.control}
    name: "Lauer (dummy)"
    serial: Rizon4s-062841
    control_enabled: false              # no real robot to drive; record only

cameras:
  static:
    placement: static
    serial: ""
    auto_serial: true                   # bind to the sole connected ZED

recording:
  root: datasets/bench                  # keep bench recordings out of the real datasets
